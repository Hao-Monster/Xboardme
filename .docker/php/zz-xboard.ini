; Slim PHP defaults for the all-in-one container.
; Tunables are overridable via Docker ENV (PHP_MEMORY_LIMIT, etc.) if needed.

memory_limit = 256M
; Knowledge attachments use resumable chunks (5 MiB by default), so PHP only
; needs to accept one bounded chunk per request rather than the whole file.
upload_max_filesize = 16M
post_max_size = 18M
max_file_uploads = 10
max_input_time = 120

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

[swoole]
swoole.use_shortname = Off
