        run: |
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          cat .github/scripts/release-state.sh .github/scripts/cleanup-xboard-live-release.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s"

  prepare-v2-low-memory:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'v2_prepare' &&
          inputs.deploy_production == false &&
          inputs.stage_production_green == false &&
          inputs.stage_production_dry_run == false &&
          inputs.cleanup_stage_run_id == '' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: distributor-server
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Verify exact V2 preparation commit and approved stage
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVED_STAGE_RUN_ID: ${{ inputs.approved_stage_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_SHA" = "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$APPROVED_STAGE_RUN_ID" = "$(printf '%s' "$APPROVED_STAGE_RUN_ID" | grep -E '^[0-9]+-[0-9]+$')"
          stage_run_id=${APPROVED_STAGE_RUN_ID%-*}
          stage_attempt=${APPROVED_STAGE_RUN_ID##*-}
          run_json=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$stage_run_id")
          jq -e --arg sha "$GITHUB_SHA" --arg attempt "$stage_attempt" '
            .head_sha == $sha and .conclusion == "success" and (.run_attempt | tostring) == $attempt
          ' <<< "$run_json" >/dev/null
          jobs_json=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$stage_run_id/jobs?per_page=100")
          jq -e '
            ([.jobs[] | select(.name == "stage-distributor-green" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name == "smoke-staged-distributor" and .conclusion == "success")] | length) == 1
          ' <<< "$jobs_json" >/dev/null
      - uses: actions/checkout@v7
      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Login server to GHCR for V2 preparation
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
      - name: Prepare immutable low-memory V2 release without production mutation
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          MAINTENANCE_PORT: ${{ inputs.stage_target_port }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/prepare-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' RELEASE_IMAGE='$RELEASE_IMAGE' MAINTENANCE_PORT='$MAINTENANCE_PORT' bash -s"
      - name: Logout server from GHCR
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"

  start-v2-low-memory:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
