            "STAGE_RUN_ID='$STAGE_RUN_ID' bash -s" \
            < .github/scripts/cleanup-xboard-stage.sh

  prepare-live-green:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'prepare' &&
          inputs.deploy_production == false &&
          inputs.stage_production_green == false &&
          inputs.stage_production_dry_run == false &&
          inputs.cleanup_stage_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: distributor-server
    permissions:
      contents: read
      packages: read

    steps:
      - name: Verify exact approved release commit and stage
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVED_STAGE_RUN_ID: ${{ inputs.approved_stage_run_id }}
        run: |
          test "${#EXPECTED_SHA}" -eq 40
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$APPROVED_STAGE_RUN_ID" = "$(printf '%s' "$APPROVED_STAGE_RUN_ID" | grep -E '^[0-9]+-[0-9]+$')"

      - name: Checkout live release script
        uses: actions/checkout@v7

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Login server to GHCR for live candidate
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Prepare live green without switching traffic
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGE_RUN_ID: ${{ inputs.approved_stage_run_id }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PORT: ${{ inputs.candidate_target_port }}
        run: |
          cat .github/scripts/release-state.sh .github/scripts/prepare-xboard-live-green.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' STAGE_RUN_ID='$STAGE_RUN_ID' RELEASE_SHA='$RELEASE_SHA' RELEASE_PORT='$RELEASE_PORT' bash -s"

      - name: Logout server from GHCR
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"

