            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"

  rollback-live-release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'rollback' &&
          inputs.deploy_production == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Restore blue traffic and role ownership
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          cat .github/scripts/release-state.sh .github/scripts/rollback-xboard-live-green.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s"

  smoke-rolled-back-blue:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.production_release_action == 'rollback' }}
    needs: rollback-live-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify blue after manual rollback
        uses: ./.github/actions/distributor-smoke
        with:
          validation_mode: rollback
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ inputs.rollback_target_port }}

  cleanup-live-release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'cleanup' &&
          inputs.deploy_production == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Remove exact release candidates after rollback
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          cat .github/scripts/release-state.sh .github/scripts/cleanup-xboard-live-release.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s"

  smoke-distributor:
    if: ${{ github.ref == 'refs/heads/codex/distributor' }}
    needs: deploy-distributor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify distributor deployment
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: 7001

