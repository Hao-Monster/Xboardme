    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'v2_switch' }}
    needs: switch-v2-low-memory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify V2 through loopback and public origin
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ inputs.rollback_target_port }}

  auto-rollback-failed-v2-switch:
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'v2_switch' &&
          inputs.deploy_production == false &&
          (needs.switch-v2-low-memory.result != 'success' ||
           needs.smoke-switched-v2.result != 'success') }}
    needs:
      - switch-v2-low-memory
      - smoke-switched-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Restore legacy after failed external V2 smoke
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_expected_sha }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/rollback-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"

  smoke-auto-rolled-back-v2:
    if: >-
      ${{ always() &&
          github.ref == 'refs/heads/codex/distributor' &&
          (needs.auto-rollback-failed-v2-start.result == 'success' ||
           needs.auto-rollback-failed-v2-switch.result == 'success') }}
    needs:
      - auto-rollback-failed-v2-start
      - auto-rollback-failed-v2-switch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify legacy after automatic V2 rollback
        uses: ./.github/actions/distributor-smoke
        with:
          validation_mode: rollback
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ inputs.rollback_target_port }}

  rollback-v2-low-memory:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'v2_rollback' &&
          inputs.deploy_production == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Verify exact V2 rollback identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_EXPECTED_SHA: ${{ inputs.release_expected_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_EXPECTED_SHA" = "$(printf '%s' "$RELEASE_EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
      - uses: actions/checkout@v7
      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Restore exact legacy runtime and storage owners
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_expected_sha }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/rollback-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"

  smoke-manual-v2-rollback:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_release_action == 'v2_rollback' }}
    needs: rollback-v2-low-memory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify legacy after manual V2 rollback
        uses: ./.github/actions/distributor-smoke
        with:
          validation_mode: rollback
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ inputs.rollback_target_port }}

  smoke-distributor:
    if: ${{ github.ref == 'refs/heads/codex/distributor' }}
    needs: deploy-distributor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify distributor deployment
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: 7001
