name: Docker Build and Publish

on:
  push:
    branches: ["codex/distributor"]
  pull_request:
    branches: ["codex/distributor"]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deprecated; keep false and use production-release.yml
        required: true
        default: false
        type: boolean
      expected_sha:
        description: Full 40-character commit SHA required when deploying production
        required: false
        type: string
      release_expected_sha:
        description: Full 40-character commit SHA recorded on an existing release candidate
        required: false
        type: string
      production_preflight:
        description: Audit the current production host without changing it
        required: true
        default: false
        type: boolean
      stage_production_green:
        description: Deprecated; keep false and use production-release.yml
        required: true
        default: false
        type: boolean
      stage_production_dry_run:
        description: Deprecated; keep false and use production-release.yml
        required: true
        default: false
        type: boolean
      stage_target_port:
        description: Remote loopback port reserved for the isolated staging container
        required: true
        default: 7003
        type: number
      candidate_target_port:
        description: Inactive loopback port for the live candidate; must match the approved stage port
        required: true
        default: 7003
        type: number
      rollback_target_port:
        description: Current live loopback port retained for rollback smoke tests
        required: true
        default: 7002
        type: number
      cleanup_stage_run_id:
        description: Remove one exact isolated stage run (digits-digits); does not affect production
        required: false
        type: string
      production_release_action:
        description: Emergency operation only; standard releases use production-release.yml
        required: true
        default: none
        type: choice
        options:
          - none
          - admin_assets
          - admin_assets_rollback
          - activate_roles
          - repair_roles
          - retire_previous
          - rollback
          - cleanup
          - v2_rollback
      release_id:
        description: Existing zero-downtime release identifier for switch/roles/rollback/cleanup
        required: false
        type: string
      approved_stage_run_id:
        description: Successful isolated stage identifier required by the prepare phase
        required: false
        type: string

concurrency:
  group: xboard-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  reject-deprecated-release-controls:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (inputs.deploy_production == true ||
           inputs.stage_production_green == true ||
           inputs.stage_production_dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Direct standard releases to the unified workflow
        run: |
          echo '::error::Legacy deploy/stage controls are disabled. Run Distributor Production Release instead.'
          exit 1

  production-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.production_preflight == true }}
    uses: ./.github/workflows/distributor-preflight.yml
    secrets: inherit

  cleanup-requested-stage:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.cleanup_stage_run_id != '' &&
          inputs.deploy_production == false &&
          inputs.stage_production_green == false &&
          inputs.stage_production_dry_run == false &&
          inputs.production_release_action == 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-staging
    permissions:
      contents: read

    steps:
      - name: Checkout staging cleanup script
        uses: actions/checkout@v7

      - name: Validate requested stage identifier
        env:
          STAGE_RUN_ID: ${{ inputs.cleanup_stage_run_id }}
        run: test "$STAGE_RUN_ID" = "$(printf '%s' "$STAGE_RUN_ID" | grep -E '^[0-9]+-[0-9]+$')"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove the exact isolated stage
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          STAGE_RUN_ID: ${{ inputs.cleanup_stage_run_id }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/cleanup-xboard-stage.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "STAGE_RUN_ID='$STAGE_RUN_ID' bash -s"

  verify:
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
          inputs.production_release_action == 'admin_assets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: xboard-test
          MYSQL_DATABASE: xboard_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pxboard-test --silent"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: xboard-test
          MYSQL_DATABASE: xboard_test
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pxboard-test --silent"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, fileinfo, zip, dom, xmlreader, intl, sodium, pdo_sqlite, sqlite3, pdo_mysql, pcntl, posix
          coverage: none

      - name: Install locked PHP dependencies once
        env:
          COMPOSER_AUTH: >-
            {"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          COMPOSER_PROCESS_TIMEOUT: 1800
        run: |
          for attempt in 1 2; do
            if composer install --prefer-dist --no-interaction --no-progress; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          composer install --prefer-source --no-interaction --no-progress

      - name: Validate dependency metadata and security advisories
        run: |
          composer validate --no-check-publish
          composer audit --locked --no-interaction

      - name: Run PHP 8.3 static analysis without new baseline violations
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run PHP 8.3 SQLite regression tests
        run: php vendor/bin/phpunit

      - name: Run MySQL 5.7 compatibility regression
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: xboard_test
          DB_USERNAME: root
          DB_PASSWORD: xboard-test
          CACHE_STORE: array
          CACHE_DRIVER: array
          CACHE_SETTINGS_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          TELESCOPE_ENABLED: 'false'
        run: php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php tests

      - name: Run MySQL 8.4 compatibility regression
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DB_DATABASE: xboard_test
          DB_USERNAME: root
          DB_PASSWORD: xboard-test
          CACHE_STORE: array
          CACHE_DRIVER: array
          CACHE_SETTINGS_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          TELESCOPE_ENABLED: 'false'
        run: php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php tests

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, fileinfo, zip, dom, xmlreader, intl, sodium, pdo_sqlite, sqlite3, pdo_mysql, pcntl, posix
          coverage: none

      - name: Validate PHP 8.4 platform and static analysis
        run: |
          composer check-platform-reqs
          php vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run PHP 8.4 SQLite regression tests
        run: php vendor/bin/phpunit

      - name: Validate companion JavaScript
        run: |
          node --check public/assets/admin-distributor.js
          node --check public/assets/admin-client-catalog.js
          node --check public/assets/admin-realtime-status.js
          node --check public/assets/admin-node-activation-schedule.js
          node --check public/assets/admin-knowledge-attachments.js
          node --check public/assets/admin-knowledge-rich-editor.js
          node --check theme/Xboard/assets/auth-session.js
          node --check theme/Xboard/assets/distributor.js
          node --check theme/Xboard/assets/distributor-message-guard.js
          node --test tests/JavaScript/*.test.js

      - name: Validate deployment scripts
        run: |
          php -l .github/scripts/validate-approved-migrations.php
          php -l .github/scripts/build-theme-asset-manifest.php
          php -l .github/scripts/verify-theme-assets.php
          php -l .github/scripts/production-image-manifest.php
          php .github/scripts/build-theme-asset-manifest.php local "$RUNNER_TEMP/theme-release-manifest.json"
          php .github/scripts/verify-theme-assets.php local "$RUNNER_TEMP/theme-release-manifest.json"
          bash -n deploy.sh
          bash -n init.sh
          bash -n update.sh
          sh -n .docker/entrypoint.sh
          sh -n .docker/run-role.sh
          bash -n .github/scripts/deploy-xboard-compose.sh
          bash -n .github/scripts/production-runtime-discovery.sh
          bash -n .github/scripts/resolve-production-image.sh
          bash -n .github/scripts/test-resolve-production-image.sh
          bash -n .github/scripts/preflight-xboard-compose.sh
          bash -n .github/scripts/stage-xboard-green.sh
          bash -n .github/scripts/cleanup-xboard-stage.sh
          bash -n .github/scripts/prepare-xboard-live-green.sh
          bash -n .github/scripts/switch-xboard-live-green.sh
          bash -n .github/scripts/activate-xboard-green-roles.sh
          bash -n .github/scripts/retire-xboard-previous-release.sh
          bash -n .github/scripts/rollback-xboard-live-green.sh
          bash -n .github/scripts/resolve-xboard-public-url.sh
          bash -n .github/scripts/ssh-askpass.sh
          bash -n .github/scripts/ssh-with-password.sh
          bash -n .github/scripts/test-ssh-with-password.sh
          bash -n .github/scripts/test-preflight-scheduler-reaper.sh
          bash -n .github/scripts/test-production-runtime-discovery.sh
          bash -n .github/scripts/smoke-admin-assets.sh
          bash -n .github/scripts/smoke-admin-assets-remote.sh
          bash -n .github/scripts/run-distributor-smoke-bounded.sh
          bash -n .github/scripts/test-run-distributor-smoke-bounded.sh
          bash -n .github/scripts/smoke-distributor-remote.sh
          bash -n .github/scripts/smoke-distributor-mobile-browser.sh
          bash -n .github/scripts/cleanup-xboard-live-release.sh
          bash -n .github/scripts/release-state.sh
          bash -n .github/scripts/test-release-state.sh
          bash -n .github/scripts/validate-v2-compose.sh
          bash -n .github/scripts/test-v2-redis.sh
          bash -n .github/scripts/v2-low-memory-common.sh
          bash -n .github/scripts/resolve-xboard-v2-port.sh
          bash -n .github/scripts/prepare-xboard-v2-low-memory.sh
          bash -n .github/scripts/verify-xboard-v2-prepared-release.sh
          bash -n .github/scripts/start-xboard-v2-low-memory.sh
          bash -n .github/scripts/switch-xboard-v2-low-memory.sh
          bash -n .github/scripts/rollback-xboard-v2-low-memory.sh
          bash -n .github/scripts/finalize-xboard-v2-low-memory.sh
          bash -n .github/scripts/plan-xboard-release-slot.sh
          bash -n .github/scripts/audit-xboard-retention.sh
          bash -n .github/scripts/cleanup-xboard-retention.sh
          bash -n .github/scripts/audit-xboard-network-debt.sh
          bash -n .github/scripts/cleanup-xboard-network-debt.sh
          bash -n .github/scripts/test-audit-xboard-network-debt.sh
          bash -n .github/scripts/test-cleanup-xboard-network-debt.sh
          bash -n .github/scripts/test-resolve-xboard-v2-port.sh
          bash -n .github/scripts/test-finalize-xboard-v2-low-memory.sh
          bash -n .github/scripts/test-plan-xboard-release-slot.sh
          bash -n .github/scripts/test-verify-xboard-v2-prepared-release.sh
          bash -n .github/scripts/test-cleanup-xboard-retention.sh
          bash -n .github/scripts/test-v2-low-memory-common.sh
          bash -n .github/scripts/test-v2-redis-owner-restore.sh
          sh -n .docker/redis/run-v2-redis.sh
          sh -n .docker/redis/healthcheck-v2-redis.sh
          php -l .github/scripts/validate-v2-compose.php
          bash .github/scripts/validate-v2-compose.sh
          bash .github/scripts/test-v2-redis.sh
          bash .github/scripts/test-v2-low-memory-common.sh
          bash .github/scripts/test-finalize-xboard-v2-low-memory.sh
          bash .github/scripts/test-plan-xboard-release-slot.sh
          bash .github/scripts/test-verify-xboard-v2-prepared-release.sh
          bash .github/scripts/test-cleanup-xboard-retention.sh
          bash .github/scripts/test-audit-xboard-network-debt.sh
          bash .github/scripts/test-cleanup-xboard-network-debt.sh
          bash .github/scripts/test-resolve-xboard-v2-port.sh
          bash .github/scripts/test-run-distributor-smoke-bounded.sh
          bash -n .github/scripts/deploy-admin-assets-hotfix.sh
          bash -n .github/scripts/rollback-admin-assets-hotfix.sh
          bash .github/scripts/test-release-state.sh
          XBOARD_PREFLIGHT_SELF_TEST=redis-topology \
            XBOARD_REDIS_CLUSTER_ENABLED=0 \
            bash .github/scripts/preflight-xboard-compose.sh
          if unsupported_output=$(XBOARD_PREFLIGHT_SELF_TEST=redis-topology \
            XBOARD_REDIS_CLUSTER_ENABLED=1 \
            bash .github/scripts/preflight-xboard-compose.sh); then
            echo 'Redis Cluster topology guard unexpectedly passed.' >&2
            exit 1
          fi
          test "$unsupported_output" = 'PREFLIGHT_FAIL=redis_cluster_not_supported'
          if unknown_output=$(XBOARD_PREFLIGHT_SELF_TEST=redis-topology \
            XBOARD_REDIS_CLUSTER_ENABLED=unknown \
            bash .github/scripts/preflight-xboard-compose.sh); then
            echo 'Unknown Redis topology guard unexpectedly passed.' >&2
            exit 1
          fi
          test "$unknown_output" = 'PREFLIGHT_FAIL=redis_cluster_topology_unknown'
          bash .github/scripts/test-ssh-with-password.sh
          bash .github/scripts/test-preflight-scheduler-reaper.sh
          bash .github/scripts/test-production-runtime-discovery.sh
          bash .github/scripts/test-resolve-production-image.sh

  pr-image-build:
    if: ${{ github.event_name == 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout exact pull request merge commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify admin frontend build context
        run: php .github/scripts/verify-admin-assets.php

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Stamp immutable pull request revision
        run: |
          VERSION="$GITHUB_SHA"
          test "$VERSION" = "$(printf '%s' "$VERSION" | grep -E '^[0-9a-f]{40}$')"
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          grep -Fq "'version' => '$VERSION'" config/app.php
          php .github/scripts/build-theme-asset-manifest.php "$VERSION" "$RUNNER_TEMP/theme-release-manifest.json"
          php .github/scripts/verify-theme-assets.php "$VERSION" "$RUNNER_TEMP/theme-release-manifest.json"

      - name: Build pull request image without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: xboard-pr:${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            APP_REVISION=${{ github.sha }}
          provenance: false
          allow: |
            network.host
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Inspect pull request image contract
        env:
          IMAGE: xboard-pr:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          docker run --rm --entrypoint sh "$IMAGE" -eu -c '
            test -x /entrypoint.sh
            test -x /run-role.sh
            test -f /www/theme/Xboard/assets/release-manifest.json
          '
          docker run --rm \
            --entrypoint /entrypoint.sh \
            --env XBOARD_RUNTIME_ROLE=ws \
            --env RUNTIME_INSTANCE_ID=ci-ws \
            "$IMAGE" sh -eu -c '
              test "$WS_LOG_FILE" = /tmp/xboard-ws-ci-ws.log
              su-exec www sh -eu -c '\''
                touch "$1"
                test -f "$1"
                test -w "$1"
              '\'' sh "$WS_LOG_FILE"
              printf "%s\n" WS_RUNTIME_LOG=PASS
            ' | grep -Fxq 'WS_RUNTIME_LOG=PASS'
          IMAGE="$IMAGE" bash .github/scripts/test-v2-redis-owner-restore.sh

  build:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/distributor' }}
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image-identity.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify admin frontend build context
        run: php .github/scripts/verify-admin-assets.php

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Reuse the unique signed image for this production commit
        id: existing-image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          exact_ref="$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$exact_ref" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)
          if [[ -z "$digest" ]]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$digest" = "$(printf '%s' "$digest" | grep -E '^sha256:[0-9a-f]{64}$')"
          gh attestation verify "oci://$IMAGE@$digest" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker-publish.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/codex/distributor \
            --deny-self-hosted-runners >/dev/null
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=,enable=true
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=distributor,enable=${{ github.ref == 'refs/heads/codex/distributor' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Stamp immutable release and asset version
        run: |
          VERSION="$GITHUB_SHA"
          test "$VERSION" = "$(printf '%s' "$VERSION" | grep -E '^[0-9a-f]{40}$')"
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          grep -Fq "'version' => '$VERSION'" config/app.php
          php .github/scripts/build-theme-asset-manifest.php "$VERSION" "$RUNNER_TEMP/theme-release-manifest.json"
          php .github/scripts/verify-theme-assets.php "$VERSION" "$RUNNER_TEMP/theme-release-manifest.json"

      - name: Build and push
        id: build-and-push
        if: ${{ steps.existing-image.outputs.found != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            APP_REVISION=${{ github.sha }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Sign production image provenance
        if: ${{ steps.existing-image.outputs.found != 'true' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Publish the immutable full-SHA image lock
        if: ${{ steps.existing-image.outputs.found != 'true' }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          test "$DIGEST" = "$(printf '%s' "$DIGEST" | grep -E '^sha256:[0-9a-f]{64}$')"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$DIGEST"

      - name: Lock the production commit to one image digest
        id: image-identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          digest=${EXISTING_DIGEST:-$BUILT_DIGEST}
          test "$digest" = "$(printf '%s' "$digest" | grep -E '^sha256:[0-9a-f]{64}$')"
          remote_digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | awk '$1 == "Digest:" { print $2; exit }')
          test "$remote_digest" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Save immutable production image manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image-identity.outputs.digest }}
        run: |
          php .github/scripts/production-image-manifest.php create \
            "$RUNNER_TEMP/production-image.json" \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$IMAGE" "$DIGEST" \
            "$GITHUB_RUN_ID"

      - name: Publish immutable production image manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/production-image.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  deploy-admin-assets-hotfix:
