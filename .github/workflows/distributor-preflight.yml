name: Distributor Production Preflight

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/codex/distributor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-staging

    steps:
      - name: Checkout preflight script
        uses: actions/checkout@v4

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit production without changing it
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' < .github/scripts/preflight-xboard-compose.sh
