name: One-time encrypted production diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character codex/distributor commit to diagnose
        required: true
        type: string
      start_utc:
        description: Inclusive UTC start in YYYY-MM-DDTHH:MM:SSZ format
        required: true
        type: string
      end_utc:
        description: Inclusive UTC end in YYYY-MM-DDTHH:MM:SSZ format (maximum six hours)
        required: true
        type: string
      job_id:
        description: Failed Horizon job UUID to inspect without exposing its payload
        required: true
        type: string

concurrency:
  group: one-time-production-diagnostics
  cancel-in-progress: false

jobs:
  encrypted-readonly-diagnostics:
    if: ${{ github.ref == 'refs/heads/codex/distributor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-staging
    permissions:
      contents: read

    steps:
      - name: Checkout the exact production commit
        uses: actions/checkout@v4

      - name: Enforce production branch, commit and bounded inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          START_UTC: ${{ inputs.start_utc }}
          END_UTC: ${{ inputs.end_utc }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/distributor'
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$START_UTC" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$END_UTC" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          start_epoch=$(date -u -d "$START_UTC" +%s)
          end_epoch=$(date -u -d "$END_UTC" +%s)
          now_epoch=$(date -u +%s)
          ((start_epoch < end_epoch))
          ((end_epoch - start_epoch <= 21600))
          ((end_epoch <= now_epoch + 300))
          bash -n .github/scripts/collect-xboard-readonly-diagnostics.sh

      - name: Verify the one-time encryption recipient
        run: |
          set -Eeuo pipefail
          openssl x509 -in .github/release/production-diagnostics-recipient.pem -noout -checkend 0
          fingerprint=$(openssl x509 -in .github/release/production-diagnostics-recipient.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')
          test "$fingerprint" = 'C7D816CC910BED9D9924C583823D6D5DD2747A0AB9A19E5051A1FEEA0A264D3A'

      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Trust the configured production host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect, compress and encrypt without exposing plaintext
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          START_UTC: ${{ inputs.start_utc }}
          END_UTC: ${{ inputs.end_utc }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/xboard-production-diagnostics.txt.gz.p7m"
          set +e
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DIAG_START_UTC='$START_UTC' DIAG_END_UTC='$END_UTC' DIAG_JOB_ID='$JOB_ID' bash -s" \
            < .github/scripts/collect-xboard-readonly-diagnostics.sh \
            2>"$RUNNER_TEMP/diagnostics-ssh-error.log" |
            gzip -9 |
            openssl cms -encrypt -stream -binary -aes-256-cbc -outform DER \
              -out "$artifact" .github/release/production-diagnostics-recipient.pem
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          for status in "${pipeline_status[@]}"; do
            if ((status != 0)); then
              rm -f "$artifact"
              echo 'Encrypted diagnostics collection failed; plaintext output was not published.' >&2
              exit 1
            fi
          done
          test -s "$artifact"
          echo "DIAGNOSTICS_CIPHERTEXT_BYTES=$(stat -c %s "$artifact")"
          echo "DIAGNOSTICS_CIPHERTEXT_SHA256=$(sha256sum "$artifact" | awk '{print $1}')"

      - name: Upload ciphertext with one-day retention
        uses: actions/upload-artifact@v4
        with:
          name: xboard-production-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/xboard-production-diagnostics.txt.gz.p7m
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
