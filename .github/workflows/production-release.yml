name: Distributor Production Release

run-name: ${{ inputs.maintenance_action == 'none' && 'Release' || inputs.maintenance_action }} ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact full workflow SHA currently at codex/distributor
        required: true
        type: string
      maintenance_action:
        description: Run the standard release or one guarded production-retention operation
        required: true
        default: none
        type: choice
        options:
          - none
          - retention_audit
          - v2_finalize
          - retention_cleanup
          - network_audit
          - network_cleanup
      release_id:
        description: Active V2 release identifier required for finalize and cleanup (digits-digits)
        required: false
        type: string
      release_expected_sha:
        description: Active application SHA required for finalize and cleanup
        required: false
        type: string
      cleanup_expected_resource_fingerprint:
        description: Exact post-finalize resource fingerprint required only for cleanup
        required: false
        type: string
      network_cleanup_expected_fingerprint:
        description: Exact read-only orphan-network fingerprint required only for network cleanup
        required: false
        type: string
      cleanup_image_min_age_seconds:
        description: Minimum age for unreferenced Xboard images; cannot be less than seven days
        required: true
        default: 604800
        type: number
      stage_target_port:
        description: Preferred inactive loopback port; the planner safely falls back within 7003-7010
        required: true
        default: 7004
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: xboard-production-release
  cancel-in-progress: false

jobs:
  retention-audit:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'retention_audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact production workflow identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inventory production retention assets without mutation
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' bash -s" |
            tee "$RUNNER_TEMP/retention-audit.txt"

      - name: Preserve the reviewed retention inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retention-audit.txt
          if-no-files-found: error
          retention-days: 90

  network-debt-audit:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'network_audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact production workflow identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inventory orphan Xboard networks without mutation
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh \
              .github/scripts/audit-xboard-network-debt.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' RETENTION_REQUIRE_FINALIZED=false RETENTION_ACQUIRE_LOCK=true bash -s" |
            tee "$RUNNER_TEMP/network-debt-audit.txt"

      - name: Preserve the reviewed network inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-network-debt-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-debt-audit.txt
          if-no-files-found: error
          retention-days: 90

  pre-network-debt-cleanup-smoke:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'network_cleanup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact network cleanup request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_EXPECTED_SHA: ${{ inputs.release_expected_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          NETWORK_FINGERPRINT: ${{ inputs.network_cleanup_expected_fingerprint }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_EXPECTED_SHA" = "$(printf '%s' "$RELEASE_EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          test "$NETWORK_FINGERPRINT" = "$(printf '%s' "$NETWORK_FINGERPRINT" | grep -E '^[0-9a-f]{64}$')"
          git merge-base --is-ancestor "$RELEASE_EXPECTED_SHA" "$GITHUB_SHA"

      - name: Verify public production before exact network cleanup
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Verify live admin assets before exact network cleanup
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ inputs.release_expected_sha }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  cleanup-orphan-production-networks:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'network_cleanup' }}
    needs: pre-network-debt-cleanup-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove only fingerprinted empty retired Xboard networks
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          EXPECTED_ACTIVE_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_ACTIVE_RELEASE_SHA: ${{ inputs.release_expected_sha }}
          EXPECTED_NETWORK_DEBT_FINGERPRINT: ${{ inputs.network_cleanup_expected_fingerprint }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh \
              .github/scripts/audit-xboard-network-debt.sh \
              .github/scripts/cleanup-xboard-network-debt.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' EXPECTED_ACTIVE_RELEASE_ID='$EXPECTED_ACTIVE_RELEASE_ID' EXPECTED_ACTIVE_RELEASE_SHA='$EXPECTED_ACTIVE_RELEASE_SHA' EXPECTED_NETWORK_DEBT_FINGERPRINT='$EXPECTED_NETWORK_DEBT_FINGERPRINT' RETENTION_REQUIRE_FINALIZED=false RETENTION_ACQUIRE_LOCK=true bash -s" |
            tee "$RUNNER_TEMP/network-debt-cleanup.txt"

      - name: Preserve exact network cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-network-debt-cleanup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-debt-cleanup.txt
          if-no-files-found: error
          retention-days: 90

  verify-network-debt-cleanup:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'network_cleanup' }}
    needs: cleanup-orphan-production-networks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify zero orphan Xboard networks and unchanged production
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          ACTIVE_RELEASE_SHA: ${{ inputs.release_expected_sha }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/preflight-xboard-compose.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$ACTIVE_RELEASE_SHA' bash -s"
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh \
              .github/scripts/audit-xboard-network-debt.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' RETENTION_REQUIRE_FINALIZED=false RETENTION_ACQUIRE_LOCK=true bash -s" |
            tee "$RUNNER_TEMP/post-network-debt-cleanup.txt"
          grep -Fxq 'NETWORK_DEBT_CANDIDATE_COUNT=0' "$RUNNER_TEMP/post-network-debt-cleanup.txt"

      - name: Preserve the post-cleanup network inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-network-debt-post-cleanup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-network-debt-cleanup.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify public production after exact network cleanup
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Verify live admin assets after exact network cleanup
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ inputs.release_expected_sha }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  pre-finalize-v2-smoke:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'v2_finalize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact finalize request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_EXPECTED_SHA: ${{ inputs.release_expected_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_EXPECTED_SHA" = "$(printf '%s' "$RELEASE_EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          git merge-base --is-ancestor "$RELEASE_EXPECTED_SHA" "$GITHUB_SHA"

      - name: Verify public production before retiring rollback assets
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Verify live admin assets before retiring rollback assets
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ inputs.release_expected_sha }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  finalize-v2-release:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'v2_finalize' }}
    needs: pre-finalize-v2-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Finalize only the exact active V2 release
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_expected_sha }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/finalize-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"

  verify-finalized-production:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'v2_finalize' }}
    needs: finalize-v2-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit runtime and retained assets after finalize
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          ACTIVE_RELEASE_SHA: ${{ inputs.release_expected_sha }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/preflight-xboard-compose.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$ACTIVE_RELEASE_SHA' bash -s"
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' bash -s" |
            tee "$RUNNER_TEMP/post-finalize-retention-audit.txt"

      - name: Preserve the post-finalize retention inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-post-finalize-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-finalize-retention-audit.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify public production after finalize
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Verify live admin assets after finalize
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ inputs.release_expected_sha }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  pre-retention-cleanup-smoke:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'retention_cleanup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact cleanup request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_EXPECTED_SHA: ${{ inputs.release_expected_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          RESOURCE_FINGERPRINT: ${{ inputs.cleanup_expected_resource_fingerprint }}
          IMAGE_MIN_AGE_SECONDS: ${{ inputs.cleanup_image_min_age_seconds }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_EXPECTED_SHA" = "$(printf '%s' "$RELEASE_EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          test "$RESOURCE_FINGERPRINT" = "$(printf '%s' "$RESOURCE_FINGERPRINT" | grep -E '^[0-9a-f]{64}$')"
          test "$IMAGE_MIN_AGE_SECONDS" = "$(printf '%s' "$IMAGE_MIN_AGE_SECONDS" | grep -E '^[0-9]+$')"
          test "$IMAGE_MIN_AGE_SECONDS" -ge 604800
          git merge-base --is-ancestor "$RELEASE_EXPECTED_SHA" "$GITHUB_SHA"

      - name: Verify public production before exact retention cleanup
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Verify live admin assets before exact retention cleanup
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ inputs.release_expected_sha }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  cleanup-retired-production-assets:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'retention_cleanup' }}
    needs: pre-retention-cleanup-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove only fingerprinted retired containers and aged Xboard images
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          EXPECTED_ACTIVE_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_ACTIVE_RELEASE_SHA: ${{ inputs.release_expected_sha }}
          EXPECTED_RETENTION_RESOURCE_FINGERPRINT: ${{ inputs.cleanup_expected_resource_fingerprint }}
          RETENTION_IMAGE_MIN_AGE_SECONDS: ${{ inputs.cleanup_image_min_age_seconds }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh \
              .github/scripts/cleanup-xboard-retention.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' EXPECTED_ACTIVE_RELEASE_ID='$EXPECTED_ACTIVE_RELEASE_ID' EXPECTED_ACTIVE_RELEASE_SHA='$EXPECTED_ACTIVE_RELEASE_SHA' EXPECTED_RETENTION_RESOURCE_FINGERPRINT='$EXPECTED_RETENTION_RESOURCE_FINGERPRINT' RETENTION_IMAGE_MIN_AGE_SECONDS='$RETENTION_IMAGE_MIN_AGE_SECONDS' RETENTION_REQUIRE_FINALIZED=true RETENTION_ACQUIRE_LOCK=true bash -s" |
            tee "$RUNNER_TEMP/retention-cleanup.txt"

      - name: Preserve exact cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-cleanup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retention-cleanup.txt
          if-no-files-found: error
          retention-days: 90

  verify-retention-cleanup:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'retention_cleanup' }}
    needs: cleanup-retired-production-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit finalized runtime and retained assets after cleanup
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          ACTIVE_RELEASE_SHA: ${{ inputs.release_expected_sha }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/preflight-xboard-compose.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$ACTIVE_RELEASE_SHA' bash -s"
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' RETENTION_REQUIRE_FINALIZED=true bash -s" |
            tee "$RUNNER_TEMP/post-cleanup-retention-audit.txt"

      - name: Preserve the post-cleanup retention inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-post-cleanup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-cleanup-retention-audit.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify public production after exact retention cleanup
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.release_expected_sha }}
          v2_release_id: ${{ inputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Verify live admin assets after exact retention cleanup
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ inputs.release_expected_sha }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  resolve-signed-image:
    if: >-
      ${{ github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.resolve.outputs.digest }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject stale or non-production dispatches
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Resolve immutable image manifest from the successful production push
        id: resolve
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-production-image.sh

      - name: Login to GHCR for provenance verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed provenance and exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
        run: |
          test "$IMAGE_REF" = "${{ steps.resolve.outputs.image }}@${{ steps.resolve.outputs.digest }}"
          gh attestation verify "oci://$IMAGE_REF" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker-publish.yml" \
            --signer-digest "$EXPECTED_SHA" \
            --source-digest "$EXPECTED_SHA" \
            --source-ref refs/heads/codex/distributor \
            --deny-self-hosted-runners >/dev/null
          echo "PRODUCTION_IMAGE_PROVENANCE=PASS sha=$EXPECTED_SHA image=$IMAGE_REF"

  production-preflight:
    needs: resolve-signed-image
    uses: ./.github/workflows/distributor-preflight.yml
    secrets: inherit

  plan-release-slot:
    needs: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read
    outputs:
      active_release_id: ${{ steps.plan.outputs.active_release_id }}
      active_revision: ${{ steps.plan.outputs.active_revision }}
      rotation_required: ${{ steps.plan.outputs.rotation_required }}
      stage_port: ${{ steps.plan.outputs.stage_port }}
    steps:
      - name: Checkout exact production workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Plan one-generation rollback rotation and an unused stage port
        id: plan
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          PREFERRED_STAGE_PORT: ${{ inputs.stage_target_port }}
        run: |
          test "$EXPECTED_WORKFLOW_SHA" = "$GITHUB_SHA"
          slot_plan=$(
            cat .github/scripts/production-runtime-discovery.sh \
                .github/scripts/release-state.sh \
                .github/scripts/audit-xboard-retention.sh \
                .github/scripts/plan-xboard-release-slot.sh |
              bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' EXPECTED_CANDIDATE_SHA='$EXPECTED_WORKFLOW_SHA' PREFERRED_STAGE_PORT='$PREFERRED_STAGE_PORT' bash -s"
          )
          printf '%s\n' "$slot_plan" | tee "$RUNNER_TEMP/release-slot-plan.txt"
          field() {
            key=$1
            value=$(printf '%s\n' "$slot_plan" | sed -n "s/^$key=//p")
            test "$(printf '%s\n' "$value" | grep -c .)" = 1
            printf '%s\n' "$value"
          }
          active_release_id=$(field RELEASE_SLOT_ACTIVE_RELEASE_ID)
          active_revision=$(field RELEASE_SLOT_ACTIVE_REVISION)
          rotation_required=$(field RELEASE_SLOT_ROTATION_REQUIRED)
          stage_port=$(field RELEASE_SLOT_STAGE_PORT)
          test "$active_release_id" = "$(printf '%s' "$active_release_id" | grep -E '^[0-9]+-[0-9]+$')"
          test "$active_revision" = "$(printf '%s' "$active_revision" | grep -E '^[0-9a-f]{40}$')"
          test "$rotation_required" = true || test "$rotation_required" = false
          test "$stage_port" = "$(printf '%s' "$stage_port" | grep -E '^700[3-9]$|^7010$')"
          git merge-base --is-ancestor "$active_revision" "$EXPECTED_WORKFLOW_SHA"
          echo "active_release_id=$active_release_id" >> "$GITHUB_OUTPUT"
          echo "active_revision=$active_revision" >> "$GITHUB_OUTPUT"
          echo "rotation_required=$rotation_required" >> "$GITHUB_OUTPUT"
          echo "stage_port=$stage_port" >> "$GITHUB_OUTPUT"

      - name: Preserve the read-only release slot plan
        uses: actions/upload-artifact@v4
        with:
          name: production-release-slot-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-slot-plan.txt
          if-no-files-found: error
          retention-days: 90

  stage-signed-image:
    needs:
      - resolve-signed-image
      - production-preflight
      - plan-release-slot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: distributor-staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify stage identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ needs.resolve-signed-image.outputs.image_ref }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_IMAGE" = "$(printf '%s' "$RELEASE_IMAGE" | grep -E '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$')"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Login server to GHCR for isolated staging
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Start isolated database-clone stage with the signed image
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          STAGE_IMAGE: ${{ needs.resolve-signed-image.outputs.image_ref }}
          STAGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGE_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/stage-xboard-green.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "STAGE_IMAGE='$STAGE_IMAGE' STAGE_RUN_ID='$STAGE_RUN_ID' STAGE_DRY_RUN=false STAGE_PORT='$STAGE_PORT' bash -s"

      - name: Authenticated browser smoke against the isolated stage
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_route: false
          expected_asset_version: ${{ inputs.expected_sha }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}

      - name: Remove the exact isolated stage
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          STAGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/cleanup-xboard-stage.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "STAGE_RUN_ID='$STAGE_RUN_ID' bash -s"

      - name: Logout server from GHCR
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"

  prepare-approved-release:
    name: Prepare approval / immutable release preparation
    needs:
      - resolve-signed-image
      - stage-signed-image
      - plan-release-slot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: distributor-server
    permissions:
      contents: read
      packages: read
    outputs:
      release_id: ${{ steps.release-identity.outputs.release_id }}

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7

      - name: Verify approved release identity
        id: release-identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ needs.resolve-signed-image.outputs.image_ref }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_IMAGE" = "$(printf '%s' "$RELEASE_IMAGE" | grep -E '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$')"
          echo "release_id=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Login server to GHCR for preparation
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Prepare the exact signed release without production mutation
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ needs.resolve-signed-image.outputs.image_ref }}
          MAINTENANCE_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/prepare-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' RELEASE_IMAGE='$RELEASE_IMAGE' MAINTENANCE_PORT='$MAINTENANCE_PORT' bash -s"

      - name: Bind the prepared release to the exact planned predecessor
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PREDECESSOR_SHA: ${{ needs.plan-release-slot.outputs.active_revision }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/verify-xboard-v2-prepared-release.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' EXPECTED_PREDECESSOR_SHA='$EXPECTED_PREDECESSOR_SHA' bash -s"

      - name: Logout server from GHCR
        if: ${{ always() }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"

  rotate-rollback-slot:
    name: Rotate the oldest rollback generation after candidate verification
    needs:
      - plan-release-slot
      - prepare-approved-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: distributor-server
    permissions:
      contents: read

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the candidate before rotating the rollback slot
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTIVE_RELEASE_ID: ${{ needs.plan-release-slot.outputs.active_release_id }}
          ACTIVE_REVISION: ${{ needs.plan-release-slot.outputs.active_revision }}
          ROTATION_REQUIRED: ${{ needs.plan-release-slot.outputs.rotation_required }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/distributor
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$ACTIVE_RELEASE_ID" = "$(printf '%s' "$ACTIVE_RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"
          test "$ACTIVE_REVISION" = "$(printf '%s' "$ACTIVE_REVISION" | grep -E '^[0-9a-f]{40}$')"
          test "$ROTATION_REQUIRED" = true || test "$ROTATION_REQUIRED" = false
          git merge-base --is-ancestor "$ACTIVE_REVISION" "$EXPECTED_SHA"

      - name: Recheck public production before rotating the rollback slot
        if: ${{ needs.plan-release-slot.outputs.rotation_required == 'true' }}
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ needs.plan-release-slot.outputs.active_revision }}
          v2_release_id: ${{ needs.plan-release-slot.outputs.active_release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Recheck live admin assets before rotating the rollback slot
        if: ${{ needs.plan-release-slot.outputs.rotation_required == 'true' }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ needs.plan-release-slot.outputs.active_revision }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Retire only the active release's oldest direct rollback generation
        if: ${{ needs.plan-release-slot.outputs.rotation_required == 'true' }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ needs.plan-release-slot.outputs.active_release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.plan-release-slot.outputs.active_revision }}
          SUPERSEDING_RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/finalize-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' V2_FINALIZE_REASON=superseded SUPERSEDING_RELEASE_SHA='$SUPERSEDING_RELEASE_SHA' bash -s"

      - name: Verify production after rotating the rollback slot
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
          ACTIVE_RELEASE_SHA: ${{ needs.plan-release-slot.outputs.active_revision }}
          STAGE_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}
        run: |
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/preflight-xboard-compose.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$ACTIVE_RELEASE_SHA' bash -s"
          cat .github/scripts/production-runtime-discovery.sh \
              .github/scripts/release-state.sh \
              .github/scripts/audit-xboard-retention.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' RETENTION_REQUIRE_FINALIZED=true RETENTION_REQUIRED_FREE_PORT='$STAGE_PORT' bash -s" |
            tee "$RUNNER_TEMP/post-rotation-retention-audit.txt"

      - name: Preserve the post-rotation retention inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-post-rotation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-rotation-retention-audit.txt
          if-no-files-found: error
          retention-days: 90

      - name: Recheck public production after rotating the rollback slot
        if: ${{ needs.plan-release-slot.outputs.rotation_required == 'true' }}
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ needs.plan-release-slot.outputs.active_revision }}
          v2_release_id: ${{ needs.plan-release-slot.outputs.active_release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}

      - name: Recheck live admin assets after rotating the rollback slot
        if: ${{ needs.plan-release-slot.outputs.rotation_required == 'true' }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          TARGET_PORT: active
          EXPECTED_ADMIN_ASSET_VERSION: ${{ needs.plan-release-slot.outputs.active_revision }}
        run: bash .github/scripts/smoke-admin-assets-remote.sh

  switch-approved-release:
    name: Switch approval / cold start, switch and public verification
    needs:
      - resolve-signed-image
      - prepare-approved-release
      - rotate-rollback-slot
      - plan-release-slot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: distributor-server
    permissions:
      contents: read

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify ready release identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ needs.resolve-signed-image.outputs.image_ref }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_IMAGE" = "$(printf '%s' "$RELEASE_IMAGE" | grep -E '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$')"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Enter maintenance and cold-start the prepared release
        id: start
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ needs.prepare-approved-release.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/start-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"

      - name: Authenticated private smoke after cold start
        id: private-smoke
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_route: false
          expected_asset_version: ${{ inputs.expected_sha }}
          v2_release_id: ${{ needs.prepare-approved-release.outputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}

      - name: Recheck privately immediately before traffic switch
        id: pre-switch-smoke
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_route: false
          expected_asset_version: ${{ inputs.expected_sha }}
          v2_release_id: ${{ needs.prepare-approved-release.outputs.release_id }}
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}

      - name: Atomically switch public traffic to the prepared release
        id: switch
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ needs.prepare-approved-release.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          cat .github/scripts/release-state.sh \
              .github/scripts/v2-low-memory-common.sh \
              .github/scripts/switch-xboard-v2-low-memory.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"

      - name: Authenticated public smoke and asset identity verification
        id: public-smoke
        uses: ./.github/actions/distributor-smoke
        with:
          verify_public_assets: true
          expected_asset_version: ${{ inputs.expected_sha }}
          v2_release_id: ${{ needs.prepare-approved-release.outputs.release_id }}
          timeout_seconds: 300
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ needs.plan-release-slot.outputs.stage_port }}

      - name: Audit the switched production runtime
        id: post-switch-preflight
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_sha }}
        run: |
          bash .github/scripts/test-preflight-scheduler-reaper.sh
          bash .github/scripts/test-production-runtime-discovery.sh
          cat .github/scripts/production-runtime-discovery.sh .github/scripts/preflight-xboard-compose.sh |
            bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_WORKFLOW_SHA='$EXPECTED_WORKFLOW_SHA' bash -s"

  auto-rollback-failed-approved-release:
    name: Automatically restore the previous release after a failed cutover
    if: >-
      ${{ always() &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'none' &&
          needs.prepare-approved-release.result == 'success' &&
          needs.switch-approved-release.result != 'success' }}
    needs:
      - prepare-approved-release
      - switch-approved-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distributor-server
    permissions:
      contents: read
    outputs:
      rollback_port: ${{ steps.rollback.outputs.rollback_port }}

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify failed release identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_ID: ${{ needs.prepare-approved-release.outputs.release_id }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$RELEASE_ID" = "$(printf '%s' "$RELEASE_ID" | grep -E '^[0-9]+-[0-9]+$')"

      - name: Trust deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore the exact previous release
        id: rollback
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          RELEASE_ID: ${{ needs.prepare-approved-release.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          rollback_output=$(
            cat .github/scripts/release-state.sh \
                .github/scripts/v2-low-memory-common.sh \
                .github/scripts/rollback-xboard-v2-low-memory.sh |
              bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"
          )
          printf '%s\n' "$rollback_output"
          rollback_port=$(
            cat .github/scripts/release-state.sh \
                .github/scripts/v2-low-memory-common.sh \
                .github/scripts/resolve-xboard-v2-port.sh |
              bash "$GITHUB_WORKSPACE/.github/scripts/ssh-with-password.sh" \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "RELEASE_ID='$RELEASE_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s"
          )
          test "$rollback_port" = "$(printf '%s' "$rollback_port" | grep -E '^[0-9]+$')"
          echo "rollback_port=$rollback_port" >> "$GITHUB_OUTPUT"

  smoke-auto-rolled-back-approved-release:
    name: Verify the automatically restored previous release
    if: >-
      ${{ always() &&
          github.ref == 'refs/heads/codex/distributor' &&
          inputs.maintenance_action == 'none' &&
          needs.auto-rollback-failed-approved-release.result == 'success' }}
    needs:
      - auto-rollback-failed-approved-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distributor-server
    permissions:
      contents: read

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Smoke the automatically restored release
        uses: ./.github/actions/distributor-smoke
        with:
          validation_mode: rollback
          timeout_seconds: 300
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ needs.auto-rollback-failed-approved-release.outputs.rollback_port }}
