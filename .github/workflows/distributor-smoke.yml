name: Distributor Production Smoke Test

on:
  workflow_call:
    inputs:
      target_port:
        description: Remote loopback port serving the release under test
        required: false
        default: 7001
        type: number
  workflow_dispatch:
    inputs:
      target_port:
        description: Remote loopback port serving the release under test
        required: true
        default: 7001
        type: number

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment: distributor-server
    steps:
      - uses: actions/checkout@v4

      - name: Verify distributor login and route isolation
        uses: ./.github/actions/distributor-smoke
        env:
          SSHPASS: ${{ secrets.SERVICES_PASSWARD }}
          DEPLOY_HOST: ${{ secrets.SERVICES_IP }}
          DEPLOY_PORT: ${{ secrets.SERVICES_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SERVICE_USER }}
          DISTRIBUTOR_EMAIL: ${{ secrets.DISTRIBUTOR_TEST_EMAIL }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.DISTRIBUTOR_TEST_PASSWORD }}
          TARGET_PORT: ${{ inputs.target_port }}
